<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전국도감 포켓몬 성격 & 능력치 계산기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #f1f5f9; color: #0f172a; }
        .up-stat { color: #ef4444 !important; font-weight: 700; background-color: #fef2f2; }
        .down-stat { color: #3b82f6 !important; font-weight: 700; background-color: #eff6ff; }
        .chart-container { position: relative; width: 100%; max-width: 480px; height: 320px; margin: 0 auto; }
        select:focus, input:focus { outline: 2px solid #ef4444; outline-offset: 1px; }
        .pokemon-img-box { background: radial-gradient(circle, rgba(241,245,249,1) 0%, rgba(226,232,240,1) 100%); border-radius: 1rem; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        
        <header class="bg-red-600 text-white p-6 text-center">
            <h1 class="text-3xl font-black tracking-tight">⚡ 전국도감 포켓몬 성격 계산기</h1>
            <p class="text-red-100 text-sm mt-1">1~9세대 1,025종 포켓몬 종족값 및 성격 보정 수치 계산기</p>
        </header>

        <div class="p-6 grid grid-cols-1 md:grid-cols-12 gap-8">
            
            <section class="md:col-span-5 bg-slate-50 p-5 rounded-xl border border-slate-200 space-y-5">
                <h2 class="text-lg font-bold text-slate-800 border-b border-slate-200 pb-2 flex items-center gap-2">
                    ⚙️ 조건 설정
                </h2>

                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">세대 선택</label>
                        <select id="genFilter" class="w-full p-2 bg-white border border-slate-300 rounded-lg text-sm font-medium">
                            <option value="all">전체 세대 (1~9세대)</option>
                            <option value="1">1세대 (관동 1~151)</option>
                            <option value="2">2세대 (성도 152~251)</option>
                            <option value="3">3세대 (호연 252~386)</option>
                            <option value="4">4세대 (신오 387~493)</option>
                            <option value="5">5세대 (하나 494~649)</option>
                            <option value="6">6세대 (칼로스 650~721)</option>
                            <option value="7">7세대 (알로라 722~809)</option>
                            <option value="8">8세대 (가라르/히수이 810~905)</option>
                            <option value="9">9세대 (팔데아 906~1025)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">🔍 포켓몬 검색 (한글/도감번호)</label>
                        <input type="text" id="searchInput" placeholder="예: 피카츄, 뮤츠, 25..." 
                               class="w-full p-2 border border-slate-300 rounded-lg text-sm focus:bg-white">
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs font-bold text-slate-600">포켓몬 선택</label>
                            <span id="loadingStatus" class="text-xs text-amber-600 font-bold">도감 데이터 불러오는 중...</span>
                        </div>
                        <select id="pokemonSelect" class="w-full p-2 bg-white border border-slate-300 rounded-lg text-sm font-semibold">
                            <option>로딩 중입니다...</option>
                        </select>
                    </div>
                </div>

                <div class="pokemon-img-box p-4 text-center border border-slate-200 flex flex-col items-center justify-center min-h-[180px]">
                    <img id="pokemonSprite" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" 
                         alt="포켓몬 이미지" class="w-32 h-32 object-contain drop-shadow-md transition-all duration-300">
                    <h3 id="pokemonName" class="font-bold text-slate-800 mt-2 text-lg">데이터 로딩 대기중...</h3>
                </div>

                <div>
                    <div class="flex justify-between text-xs font-bold text-slate-600 mb-1">
                        <span>레벨 (Level)</span>
                        <span id="levelValue" class="text-red-600 font-black text-sm">50</span>
                    </div>
                    <input type="range" id="levelInput" min="1" max="100" value="50" class="w-full accent-red-600 cursor-pointer">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">성격 (Nature) 선택</label>
                    <select id="natureSelect" class="w-full p-2 bg-white border border-slate-300 rounded-lg text-sm font-semibold">
                    </select>
                    <div id="natureInfo" class="mt-2 text-xs bg-white p-2.5 rounded-lg border border-slate-200 space-y-1">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">개체값 (IV)</label>
                        <input type="number" id="ivInput" min="0" max="31" value="31" 
                               class="w-full p-2 border border-slate-300 rounded-lg text-sm font-bold text-center">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">노력치 (EV)</label>
                        <input type="number" id="evInput" min="0" max="252" value="0" 
                               class="w-full p-2 border border-slate-300 rounded-lg text-sm font-bold text-center">
                    </div>
                </div>
            </section>

            <section class="md:col-span-7 space-y-6">
                
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <h2 class="text-base font-bold text-slate-800 mb-2 flex items-center gap-2">
                        📊 스탯 방사형 차트
                    </h2>
                    <div class="chart-container">
                        <canvas id="radarChart"></canvas>
                    </div>
                </div>

                <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <h2 class="text-base font-bold text-slate-800 p-4 border-b border-slate-100 flex items-center gap-2">
                        📋 능력치 상세표
                    </h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-center">
                            <thead class="bg-slate-50 text-slate-600 text-xs font-bold uppercase border-b border-slate-200">
                                <tr>
                                    <th class="p-3 text-left pl-4">능력치</th>
                                    <th class="p-3">종족값</th>
                                    <th class="p-3">성격 보정</th>
                                    <th class="p-3 text-red-600">최종 능력치</th>
                                </tr>
                            </thead>
                            <tbody id="statsTableBody" class="divide-y divide-slate-100">
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
