<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전국도감 포켓몬 성격 & 능력치 계산기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #f1f5f9; color: #0f172a; }
        .up-stat { color: #ef4444 !important; font-weight: 700; background-color: #fef2f2; }
        .down-stat { color: #3b82f6 !important; font-weight: 700; background-color: #eff6ff; }
        .chart-container { position: relative; width: 100%; max-width: 480px; height: 320px; margin: 0 auto; }
        select:focus, input:focus { outline: 2px solid #ef4444; outline-offset: 1px; }
        .pokemon-img-box { background: radial-gradient(circle, rgba(241,245,249,1) 0%, rgba(226,232,240,1) 100%); border-radius: 1rem; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        
        <header class="bg-red-600 text-white p-6 text-center">
            <h1 class="text-3xl font-black tracking-tight">⚡ 전국도감 포켓몬 성격 계산기</h1>
            <p class="text-red-100 text-sm mt-1">1~9세대 1,025종 포켓몬 종족값 및 성격 보정 수치 계산기</p>
        </header>

        <div class="p-6 grid grid-cols-1 md:grid-cols-12 gap-8">
            
            <section class="md:col-span-5 bg-slate-50 p-5 rounded-xl border border-slate-200 space-y-5">
                <h2 class="text-lg font-bold text-slate-800 border-b border-slate-200 pb-2 flex items-center gap-2">
                    ⚙️ 조건 설정
                </h2>

                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">세대 선택</label>
                        <select id="genFilter" class="w-full p-2 bg-white border border-slate-300 rounded-lg text-sm font-medium">
                            <option value="all">전체 세대 (1~9세대 + 특수)</option>
                            <option value="1">1세대 (관동 1~151)</option>
                            <option value="2">2세대 (성도 152~251)</option>
                            <option value="3">3세대 (호연 252~386)</option>
                            <option value="4">4세대 (신오 387~493)</option>
                            <option value="5">5세대 (하나 494~649)</option>
                            <option value="6">6세대 (칼로스 650~721)</option>
                            <option value="7">7세대 (알로라 722~809)</option>
                            <option value="unknown">❓ 세대 불명 (멜탄/멜메탈)</option>
                            <option value="8">8세대 (가라르/히스히 810~905)</option>
                            <option value="9">9세대 (팔데아 906~1025)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">🔍 포켓몬 검색 (한글/도감번호)</label>
                        <input type="text" id="searchInput" placeholder="예: 피카츄, 멜탄, 808..." 
                               class="w-full p-2 border border-slate-300 rounded-lg text-sm focus:bg-white">
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs font-bold text-slate-600">포켓몬 선택</label>
                            <span id="loadingStatus" class="text-xs text-amber-600 font-bold">도감 데이터 불러오는 중...</span>
                        </div>
                        <select id="pokemonSelect" class="w-full p-2 bg-white border border-slate-300 rounded-lg text-sm font-semibold">
                            <option>로딩 중입니다...</option>
                        </select>
                    </div>
                </div>

                <div class="pokemon-img-box p-4 text-center border border-slate-200 flex flex-col items-center justify-center min-h-[180px]">
                    <img id="pokemonSprite" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" 
                         alt="포켓몬 이미지" class="w-32 h-32 object-contain drop-shadow-md transition-all duration-300">
                    <h3 id="pokemonName" class="font-bold text-slate-800 mt-2 text-lg">데이터 로딩 대기중...</h3>
                </div>

                <div>
                    <div class="flex justify-between text-xs font-bold text-slate-600 mb-1">
                        <span>레벨 (Level)</span>
                        <span id="levelValue" class="text-red-600 font-black text-sm">50</span>
                    </div>
                    <input type="range" id="levelInput" min="1" max="100" value="50" class="w-full accent-red-600 cursor-pointer">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">성격 (Nature) 선택</label>
                    <select id="natureSelect" class="w-full p-2 bg-white border border-slate-300 rounded-lg text-sm font-semibold">
                    </select>
                    <div id="natureInfo" class="mt-2 text-xs bg-white p-2.5 rounded-lg border border-slate-200 space-y-1">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">개체값 (IV)</label>
                        <input type="number" id="ivInput" min="0" max="31" value="31" 
                               class="w-full p-2 border border-slate-300 rounded-lg text-sm font-bold text-center">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">노력치 (EV)</label>
                        <input type="number" id="evInput" min="0" max="252" value="0" 
                               class="w-full p-2 border border-slate-300 rounded-lg text-sm font-bold text-center">
                    </div>
                </div>
            </section>

            <section class="md:col-span-7 space-y-6">
                
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <h2 class="text-base font-bold text-slate-800 mb-2 flex items-center gap-2">
                        📊 스탯 방사형 차트
                    </h2>
                    <div class="chart-container">
                        <canvas id="radarChart"></canvas>
                    </div>
                </div>

                <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <h2 class="text-base font-bold text-slate-800 p-4 border-b border-slate-100 flex items-center gap-2">
                        📋 능력치 상세표
                    </h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-center">
                            <thead class="bg-slate-50 text-slate-600 text-xs font-bold uppercase border-b border-slate-200">
                                <tr>
                                    <th class="p-3 text-left pl-4">능력치</th>
                                    <th class="p-3">종족값</th>
                                    <th class="p-3">성격 보정</th>
                                    <th class="p-3 text-red-600">최종 능력치</th>
                                </tr>
                            </thead>
                            <tbody id="statsTableBody" class="divide-y divide-slate-100">
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

        </div>
    </div>

    <script>
        const NATURE_DATA = {
            "고집 (Adamant)": { up: "attack", down: "special-attack" },
            "조심 (Modest)": { up: "special-attack", down: "attack" },
            "겁쟁이 (Timid)": { up: "speed", down: "attack" },
            "명랑 (Jolly)": { up: "speed", down: "special-attack" },
            "대담 (Bold)": { up: "defense", down: "attack" },
            "장난꾸러기 (Impish)": { up: "defense", down: "special-attack" },
            "차분 (Calm)": { up: "special-defense", down: "attack" },
            "신중 (Careful)": { up: "special-defense", down: "special-attack" },
            "외로움 (Lonely)": { up: "attack", down: "defense" },
            "개구쟁이 (Naughty)": { up: "attack", down: "special-defense" },
            "용감 (Brave)": { up: "attack", down: "speed" },
            "의젓 (Mild)": { up: "special-attack", down: "defense" },
            "덜렁 (Rash)": { up: "special-attack", down: "special-defense" },
            "냉정 (Quiet)": { up: "special-attack", down: "speed" },
            "장난기 (Lax)": { up: "defense", down: "special-defense" },
            "무사태평 (Relaxed)": { up: "defense", down: "speed" },
            "얌전 (Gentle)": { up: "special-defense", down: "defense" },
            "건방 (Sassy)": { up: "special-defense", down: "speed" },
            "성급 (Hasty)": { up: "speed", down: "defense" },
            "천진난만 (Naive)": { up: "speed", down: "special-defense" },
            "노력 (Hardy)": { up: null, down: null },
            "수줍음 (Bashful)": { up: null, down: null },
            "온순 (Docile)": { up: null, down: null },
            "변덕 (Quirky)": { up: null, down: null },
            "진지 (Serious)": { up: null, down: null }
        };

        const STAT_KEYS = ["hp", "attack", "defense", "special-attack", "special-defense", "speed"];
        const STAT_NAMES = {
            "hp": "체력 (HP)", "attack": "공격 (Atk)", "defense": "방어 (Def)",
            "special-attack": "특수공격 (Sp.Atk)", "special-defense": "특수방어 (Sp.Def)", "speed": "스피드 (Speed)"
        };

        let pokemonMap = new Map();
        let currentPokemonStats = { hp: 0, attack: 0, defense: 0, "special-attack": 0, "special-defense": 0, speed: 0 };
        let chartInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
        });

        function initApp() {
            populateNatures(document.getElementById('natureSelect'));
            setupChart();
            loadAllPokemonNames();

            document.getElementById('genFilter').addEventListener('change', filterPokemonList);
            document.getElementById('searchInput').addEventListener('input', filterPokemonList);
            document.getElementById('pokemonSelect').addEventListener('change', (e) => fetchPokemonStats(e.target.value));
            document.getElementById('natureSelect').addEventListener('change', updateCalculations);
            
            document.getElementById('levelInput').addEventListener('input', (e) => {
                document.getElementById('levelValue').textContent = e.target.value;
                updateCalculations();
            });
            document.getElementById('ivInput').addEventListener('input', updateCalculations);
            document.getElementById('evInput').addEventListener('input', updateCalculations);
        }

        // 세대 판별 (멜탄: 808, 멜메탈: 809는 'unknown'으로 별도 처리)
        function getGeneration(id) {
            if (id === 808 || id === 809) return 'unknown';
            if (id <= 151) return 1; if (id <= 251) return 2; if (id <= 386) return 3;
            if (id <= 493) return 4; if (id <= 649) return 5; if (id <= 721) return 6;
            if (id <= 809) return 7; if (id <= 905) return 8; return 9;
        }

        async function loadAllPokemonNames() {
            const statusEl = document.getElementById('loadingStatus');
            try {
                const res = await fetch('https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/pokemon_species_names.csv');
                const text = await res.text();
                const lines = text.split('\n');
                
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    const parts = line.split(',');
                    const id = parseInt(parts[0]);
                    const langId = parseInt(parts[1]); 
                    const name = parts[2];

                    if (langId === 3 && id <= 1025) {
                        pokemonMap.set(id, { id: id, name: name, gen: getGeneration(id) });
                    }
                }
                
                statusEl.textContent = `✅ 1,025종 로딩 완료`;
                statusEl.className = "text-xs text-green-600 font-bold";
                filterPokemonList();
                fetchPokemonStats(25);

            } catch (error) {
                statusEl.textContent = `❌ 데이터 로딩 실패`;
                statusEl.className = "text-xs text-red-600 font-bold";
            }
        }

        async function fetchPokemonStats(idVal) {
            const id = parseInt(idVal, 10);
            if (!id || !pokemonMap.has(id)) return;

            const target = pokemonMap.get(id);
            const nameEl = document.getElementById('pokemonName');
            const spriteEl = document.getElementById('pokemonSprite');
            
            nameEl.textContent = `${target.name} (#${String(id).padStart(4, '0')}) - 스탯 로딩중...`;

            try {
                const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
                const data = await res.json();

                const stats = {};
                data.stats.forEach(s => {
                    stats[s.stat.name] = s.base_stat;
                });
                
                currentPokemonStats = stats;
                
                const imgUrl = data.sprites.other['official-artwork'].front_default;
                if (imgUrl) spriteEl.src = imgUrl;

                nameEl.textContent = `${target.name} (#${String(id).padStart(4, '0')})`;
                updateCalculations();

            } catch (error) {
                nameEl.textContent = `${target.name} (불러오기 실패)`;
            }
        }

        function populateNatures(selectEl) {
            selectEl.innerHTML = '';
            for (let nature in NATURE_DATA) {
                const opt = document.createElement('option');
                opt.value = nature; opt.textContent = nature;
                selectEl.appendChild(opt);
            }
        }

        function filterPokemonList() {
            const genFilter = document.getElementById('genFilter').value;
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const selectEl = document.getElementById('pokemonSelect');

            let list = Array.from(pokemonMap.values());

            if (genFilter !== 'all') {
                if (genFilter === 'unknown') {
                    list = list.filter(p => p.gen === 'unknown');
                } else {
                    const genNum = parseInt(genFilter, 10);
                    list = list.filter(p => p.gen === genNum);
                }
            }

            if (query !== '') {
                list = list.filter(p => p.name.includes(query) || String(p.id).includes(query));
            }

            selectEl.innerHTML = '';
            if (list.length === 0) {
                selectEl.innerHTML = '<option disabled selected>검색 결과가 없습니다.</option>';
                return;
            }

            list.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                let genLabel = p.gen === 'unknown' ? '세대불명' : `${p.gen}세대`;
                opt.textContent = `#${String(p.id).padStart(4, '0')} [${genLabel}] - ${p.name}`;
                selectEl.appendChild(opt);
            });

            fetchPokemonStats(list[0].id);
        }

        function calcHP(base, iv, ev, level) {
            if (base === 0) return 0;
            return Math.floor(((2 * base + iv + Math.floor(ev / 4)) * level) / 100) + level + 10;
        }

        function calcStat(base, iv, ev, level, mult) {
            if (base === 0) return 0;
            const baseCalc = Math.floor(((2 * base + iv + Math.floor(ev / 4)) * level) / 100) + 5;
            return Math.floor(baseCalc * mult);
        }

        function updateCalculations() {
            const levelInput = document.getElementById('levelInput');
            if (!levelInput) return;
            const level = parseInt(levelInput.value) || 50;
            const iv = parseInt(document.getElementById('ivInput').value) || 0;
            const ev = parseInt(document.getElementById('evInput').value) || 0;
            const natureSelect = document.getElementById('natureSelect');
            const nature = NATURE_DATA[natureSelect.value];

            if (!nature) return;

            const upText = nature.up ? STAT_NAMES[nature.up] : '없음';
            const downText = nature.down ? STAT_NAMES[nature.down] : '없음';
            const natureInfoEl = document.getElementById('natureInfo');
            if (natureInfoEl) {
                natureInfoEl.innerHTML = `
                    <div class="text-red-500 font-semibold">🔺 상승 (×1.1): ${upText}</div>
                    <div class="text-blue-500 font-semibold">🔻 하락 (×0.9): ${downText}</div>
                `;
            }

            const baseValues = [];
            const finalValues = [];
            const tableBody = document.getElementById('statsTableBody');
            if (tableBody) tableBody.innerHTML = '';

            STAT_KEYS.forEach(key => {
                const base = currentPokemonStats[key] || 0;
                let mult = 1.0; let badge = '➖'; let rowClass = '';

                if (nature.up === key) { mult = 1.1; badge = '🔺 (+10%)'; rowClass = 'up-stat'; } 
                else if (nature.down === key) { mult = 0.9; badge = '🔻 (-10%)'; rowClass = 'down-stat'; }

                let finalStat = (key === 'hp') ? calcHP(base, iv, ev, level) : calcStat(base, iv, ev, level, mult);

                baseValues.push(base);
                finalValues.push(finalStat);

                if (tableBody) {
                    tableBody.innerHTML += `
                        <tr class="border-b border-slate-100 hover:bg-slate-50">
                            <td class="p-3 text-left pl-4 font-medium text-slate-700">${STAT_NAMES[key]}</td>
                            <td class="p-3 text-slate-600">${base}</td>
                            <td class="p-3 ${rowClass}">${badge}</td>
                            <td class="p-3 font-bold text-slate-900">${finalStat}</td>
                        </tr>
                    `;
                }
            });

            updateChart(baseValues, finalValues);
        }

        function setupChart() {
            const canvas = document.getElementById('radarChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: STAT_KEYS.map(k => STAT_NAMES[k]),
                    datasets: [
                        { label: '종족값', data: [0,0,0,0,0,0], backgroundColor: 'rgba(148, 163, 184, 0.2)', borderColor: '#94a3b8' },
                        { label: '최종 능력치', data: [0,0,0,0,0,0], backgroundColor: 'rgba(239, 68, 68, 0.25)', borderColor: '#ef4444' }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { r: { beginAtZero: true } } }
            });
        }

        function updateChart(baseValues, finalValues) {
            if (!chartInstance) return;
            chartInstance.data.datasets[0].data = baseValues;
            chartInstance.data.datasets[1].data = finalValues;
            chartInstance.update();
        }
    </script>
</body>
</html>
