<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>포켓몬 전국도감 & 능력치 계산기</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f1f5f9;
            color: #0f172a;
        }

        .up-stat {
            color: #ef4444 !important;
            font-weight: 700;
            background-color: #fef2f2;
        }

        .down-stat {
            color: #3b82f6 !important;
            font-weight: 700;
            background-color: #eff6ff;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 320px;
            margin: 0 auto;
        }

        select:focus,
        input:focus {
            outline: 2px solid #ef4444;
            outline-offset: 1px;
        }

        .tab-button {
            transition: all 0.2s;
        }

        .tab-button.active {
            background: #dc2626;
            color: white;
        }

        .pokemon-card {
            transition:
                transform 0.15s,
                box-shadow 0.15s,
                border-color 0.15s;
        }

        .pokemon-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.12);
            border-color: #f87171;
        }

        .pokemon-card.selected {
            border-color: #ef4444;
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.15);
        }

        .type-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 3px 9px;

            border-radius: 999px;

            font-size: 11px;
            font-weight: 800;

            background: #e2e8f0;
            color: #334155;
        }

        .stat-bar {
            height: 9px;
            border-radius: 999px;
            background: #e2e8f0;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            border-radius: 999px;
        }

        .dex-grid {
            max-height: 800px;
            overflow-y: auto;
        }
    </style>
</head>

<body class="min-h-screen py-6 px-3 sm:px-6">

<div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">

    <!-- ================= HEADER ================= -->

    <header class="bg-red-600 text-white p-6 text-center">

        <h1 class="text-3xl sm:text-4xl font-black">
            ⚡ 포켓몬 전국도감
        </h1>

        <p class="text-red-100 text-sm mt-2">
            1~9세대 1,025종 포켓몬 도감 & 능력치 계산기
        </p>

    </header>


    <!-- ================= NAV ================= -->

    <nav class="p-3 bg-white border-b border-slate-200 flex flex-wrap gap-2 justify-center">

        <button
            id="tabDex"
            class="tab-button active px-5 py-3 rounded-xl font-bold text-sm"
        >
            📕 전국도감
        </button>

        <button
            id="tabCalculator"
            class="tab-button bg-slate-100 text-slate-700 px-5 py-3 rounded-xl font-bold text-sm"
        >
            📊 능력치 계산기
        </button>

    </nav>


    <!-- ========================================================= -->
    <!-- ===================== 전국도감 ========================== -->
    <!-- ========================================================= -->

    <main id="dexView" class="p-4 sm:p-6">

        <!-- 도감 검색 영역 -->

        <section class="bg-slate-50 border border-slate-200 rounded-2xl p-5">

            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">

                <div>

                    <h2 class="text-2xl font-black text-slate-800">
                        📕 전국도감
                    </h2>

                    <p class="text-sm text-slate-500 mt-1">
                        포켓몬 이름이나 도감번호로 검색할 수 있습니다.
                    </p>

                </div>

                <div
                    id="dexStatus"
                    class="text-xs font-bold text-amber-600"
                >
                    도감 데이터 불러오는 중...
                </div>

            </div>


            <!-- 검색 -->

            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-5">

                <div class="md:col-span-2">

                    <label class="block text-xs font-bold text-slate-600 mb-1">
                        🔍 포켓몬 검색
                    </label>

                    <input
                        id="dexSearchInput"
                        type="text"
                        placeholder="예: 피카츄, 리자몽, 25"
                        class="w-full p-3 bg-white border border-slate-300 rounded-xl"
                    >

                </div>


                <div>

                    <label class="block text-xs font-bold text-slate-600 mb-1">
                        세대 선택
                    </label>

                    <select
                        id="dexGenFilter"
                        class="w-full p-3 bg-white border border-slate-300 rounded-xl font-semibold"
                    >

                        <option value="all">
                            전체 세대
                        </option>

                        <option value="1">
                            1세대 · 관동
                        </option>

                        <option value="2">
                            2세대 · 성도
                        </option>

                        <option value="3">
                            3세대 · 호연
                        </option>

                        <option value="4">
                            4세대 · 신오
                        </option>

                        <option value="5">
                            5세대 · 하나
                        </option>

                        <option value="6">
                            6세대 · 칼로스
                        </option>

                        <option value="7">
                            7세대 · 알로라
                        </option>

                        <option value="8">
                            8세대 · 가라르 / 히스이
                        </option>

                        <option value="9">
                            9세대 · 팔데아
                        </option>

                    </select>

                </div>

            </div>


            <!-- 카운터 -->

            <div class="flex flex-wrap gap-2 mt-4">

                <div class="bg-white border border-slate-200 rounded-lg px-3 py-2 text-xs font-bold">
                    전체:
                    <span id="dexTotalCount">0</span>
                </div>

                <div class="bg-white border border-slate-200 rounded-lg px-3 py-2 text-xs font-bold">
                    현재 표시:
                    <span id="dexShownCount">0</span>
                </div>

                <button
                    id="dexResetBtn"
                    class="ml-auto bg-slate-800 hover:bg-slate-700 text-white rounded-lg px-3 py-2 text-xs font-bold"
                >
                    필터 초기화
                </button>

            </div>


            <!-- 도감 카드 -->

            <div
                id="dexGrid"
                class="dex-grid grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 mt-5"
            >
            </div>

        </section>


        <!-- ================= 상세정보 ================= -->

        <section
            id="dexDetail"
            class="mt-6 bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden"
        >

            <div class="p-5 border-b border-slate-200 bg-slate-50">

                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">

                    <div>

                        <h2 class="text-xl font-black text-slate-800">
                            🔎 포켓몬 상세정보
                        </h2>

                        <p class="text-xs text-slate-500 mt-1">
                            도감에서 포켓몬을 클릭하면 상세정보가 표시됩니다.
                        </p>

                    </div>


                    <button
                        id="openCalculatorBtn"
                        class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-xl text-sm"
                    >
                        📊 능력치 계산하기
                    </button>

                </div>

            </div>


            <div
                id="dexDetailContent"
                class="p-5"
            >

                <div class="text-center py-12 text-slate-400">
                    포켓몬을 선택해주세요.
                </div>

            </div>

        </section>

    </main>


    <!-- ========================================================= -->
    <!-- ==================== 능력치 계산기 ====================== -->
    <!-- ========================================================= -->

    <main
        id="calculatorView"
        class="hidden p-4 sm:p-6"
    >

        <div class="mb-5">

            <button
                id="backToDexBtn"
                class="text-sm font-bold text-red-600 hover:text-red-700"
            >
                ← 전국도감으로 돌아가기
            </button>

        </div>


        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">


            <!-- ================= 왼쪽 ================= -->

            <section
                class="lg:col-span-5 bg-slate-50 p-5 rounded-xl border border-slate-200 space-y-5"
            >

                <h2 class="text-lg font-bold text-slate-800 border-b border-slate-200 pb-2">
                    ⚙️ 조건 설정
                </h2>


                <!-- 세대 -->

                <div>

                    <label class="block text-xs font-bold text-slate-600 mb-1">
                        세대 선택
                    </label>

                    <select
                        id="genFilter"
                        class="w-full p-2 bg-white border border-slate-300 rounded-lg"
                    >

                        <option value="all">
                            전체 세대
                        </option>

                        <option value="1">1세대</option>
                        <option value="2">2세대</option>
                        <option value="3">3세대</option>
                        <option value="4">4세대</option>
                        <option value="5">5세대</option>
                        <option value="6">6세대</option>
                        <option value="7">7세대</option>
                        <option value="8">8세대</option>
                        <option value="9">9세대</option>

                    </select>

                </div>


                <!-- 검색 -->

                <div>

                    <label class="block text-xs font-bold text-slate-600 mb-1">
                        🔍 포켓몬 검색
                    </label>

                    <input
                        id="searchInput"
                        type="text"
                        placeholder="피카츄, 리자몽, 25..."
                        class="w-full p-2 border border-slate-300 rounded-lg"
                    >

                </div>


                <!-- 선택 -->

                <div>

                    <div class="flex justify-between mb-1">

                        <label class="text-xs font-bold text-slate-600">
                            포켓몬 선택
                        </label>

                        <span
                            id="loadingStatus"
                            class="text-xs text-amber-600 font-bold"
                        >
                            로딩 중...
                        </span>

                    </div>


                    <select
                        id="pokemonSelect"
                        class="w-full p-2 bg-white border border-slate-300 rounded-lg font-semibold"
                    >
                        <option>
                            로딩 중입니다...
                        </option>
                    </select>

                </div>


                <!-- 이미지 -->

                <div
                    class="bg-slate-100 rounded-xl border border-slate-200 p-4 text-center"
                >

                    <img
                        id="pokemonSprite"
                        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png"
                        class="w-36 h-36 object-contain mx-auto"
                    >

                    <h3
                        id="pokemonName"
                        class="font-bold text-lg mt-2"
                    >
                        데이터 로딩 대기중...
                    </h3>

                </div>


                <!-- 레벨 -->

                <div>

                    <div class="flex justify-between text-xs font-bold">

                        <span>
                            레벨
                        </span>

                        <span
                            id="levelValue"
                            class="text-red-600"
                        >
                            50
                        </span>

                    </div>


                    <input
                        type="range"
                        id="levelInput"
                        min="1"
                        max="100"
                        value="50"
                        class="w-full accent-red-600"
                    >

                </div>


                <!-- 성격 -->

                <div>

                    <label class="block text-xs font-bold text-slate-600 mb-1">
                        성격
                    </label>

                    <select
                        id="natureSelect"
                        class="w-full p-2 bg-white border border-slate-300 rounded-lg"
                    >
                    </select>


                    <div
                        id="natureInfo"
                        class="mt-2 bg-white p-3 rounded-lg border border-slate-200 text-xs"
                    >
                    </div>

                </div>


                <!-- IV / EV -->

                <div class="grid grid-cols-2 gap-3">

                    <div>

                        <label class="block text-xs font-bold">
                            개체값 IV
                        </label>

                        <input
                            type="number"
                            id="ivInput"
                            min="0"
                            max="31"
                            value="31"
                            class="w-full p-2 border rounded-lg text-center font-bold"
                        >

                    </div>


                    <div>

                        <label class="block text-xs font-bold">
                            노력치 EV
                        </label>

                        <input
                            type="number"
                            id="evInput"
                            min="0"
                            max="252"
                            value="0"
                            class="w-full p-2 border rounded-lg text-center font-bold"
                        >

                    </div>

                </div>

            </section>


            <!-- ================= 오른쪽 ================= -->

            <section class="lg:col-span-7 space-y-6">


                <!-- 차트 -->

                <div class="bg-white p-4 rounded-xl border shadow-sm">

                    <h2 class="font-bold mb-2">
                        📊 스탯 방사형 차트
                    </h2>

                    <div class="chart-container">

                        <canvas id="radarChart"></canvas>

                    </div>

                </div>


                <!-- 표 -->

                <div
                    class="bg-white rounded-xl border shadow-sm overflow-hidden"
                >

                    <h2
                        class="font-bold p-4 border-b"
                    >
                        📋 능력치 상세표
                    </h2>


                    <div class="overflow-x-auto">

                        <table class="w-full text-sm text-center">

                            <thead class="bg-slate-50">

                                <tr>

                                    <th class="p-3 text-left">
                                        능력치
                                    </th>

                                    <th class="p-3">
                                        종족값
                                    </th>

                                    <th class="p-3">
                                        성격
                                    </th>

                                    <th class="p-3 text-red-600">
                                        최종 능력치
                                    </th>

                                </tr>

                            </thead>


                            <tbody
                                id="statsTableBody"
                            >
                            </tbody>

                        </table>

                    </div>

                </div>

            </section>

        </div>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
